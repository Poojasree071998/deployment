services:
  - type: web
    name: paas-backend
    env: node
    rootDir: apps/backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: MOCK_MODE
        value: "true" # Keep true unless MongoDB/Redis are provided
      - key: PORT
        value: 5000
      - key: NODE_VERSION
        value: 18.0.0
